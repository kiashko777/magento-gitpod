# Magento GitPod Services Configuration
# This file stores the service configuration for automatic startup

# MySQL Configuration
MYSQL_VERSION=5.7
MYSQL_ROOT_PASSWORD=nem4540
MYSQL_DATABASE=magento2
MYSQL_PORT=3306
MYSQL_DATA_DIR=/workspace/magento-gitpod/mysql

# Elasticsearch Configuration
ELASTICSEARCH_VERSION=7.17.10
ELASTICSEARCH_PORT=9200
ELASTICSEARCH_PORT_TRANSPORT=9300
ELASTICSEARCH_JAVA_OPTS=-Xms512m -Xmx512m

# Redis Configuration
REDIS_VERSION=latest
REDIS_PORT=6379

# PHP Server Configuration
PHP_SERVER_PORT=8002
PHP_DOCUMENT_ROOT=/workspace/magento-gitpod/pub/
PHP_ROUTER_FILE=/workspace/magento-gitpod/pub/router.php

# Magento Configuration
MAGENTO_ADMIN_USERNAME=admin
MAGENTO_ADMIN_PASSWORD=password1
MAGENTO_ADMIN_EMAIL=admin@magento.com
MAGENTO_LANGUAGE=en_US
MAGENTO_CURRENCY=USD
MAGENTO_TIMEZONE=America/Chicago